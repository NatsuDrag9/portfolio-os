name: Deploy Production Build to Google Cloud Storage

on:
  push:
    branches:
      - main

# Prevent concurrent deployments that could race against each other
concurrency:
  group: deploy-to-gcs
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        run: yarn build
        # If you also want Storybook built and bundled alongside the app,
        # you can use: run: yarn build:deploy

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to GCS
    runs-on: ubuntu-latest
    needs: build

    # id-token: write is required for requesting the GitHub OIDC JWT token
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Authenticate to Google Cloud via OIDC (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload production build to Google Cloud Storage
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: 'dist'
          destination: '${{ secrets.GCP_STORAGE_BUCKET }}'
          parent: false # Uploads contents of dist/ directly to the root of the bucket
